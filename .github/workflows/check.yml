name: Check
# Every push runs the quick checks, the unit tests and a production build of
# both apps, so a route that fails `next build` shows up here rather than as a
# failed deploy.
on:
  push:
    paths:
      - '**'

permissions:
  contents: read

# A newer push cancels the run still going for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          # The version Vercel builds and runs both apps with.
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          # The version in package.json's packageManager.
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: 🔦 Run linter
        run: bun run lint
      - name: Check formatting
        run: bun run format:check
      - name: 🪐 Check TypeScript
        run: bun run typecheck
      - name: Run unit tests
        run: bun run test
      - name: Build both apps
        run: bun run build --filter=@devize/app --filter=@devize/web
        env:
          # No real secrets: a placeholder passes the app's env validation
          # (src/env.mjs) and nothing calls it while building. Without
          # SENTRY_AUTH_TOKEN, no source maps are uploaded to Sentry.
          NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
